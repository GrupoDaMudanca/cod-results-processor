version: '3.9'

services:
  cod-result-processor:
    build:
      context: .
    image: cod-result-processor:development
    env_file:
      - .env.development
    container_name: cod-result-processor
    restart: unless-stopped
    volumes:
      - .:/app
    command: watchmedo auto-restart --directory=./ --pattern="*.py" --recursive -- python -u main.py

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - ./.data/evolution_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    depends_on:
      - evolution-postgres
    ports:
      - "8082:8080"
    env_file:
      - .env.development
    environment:
      - SERVER_PORT=8080
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_db
      - AUTHENTICATION_TYPE=apikey
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - REDIS_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    volumes:
      - ./.data/evolution_instances:/evolution/instances
      - ./.data/evolution_store:/evolution/store
    restart: unless-stopped

  evolution-manager:
    image: evoapicloud/evolution-manager:v2.3.5
    container_name: evolution-manager
    entrypoint: >
      /bin/sh -c "sed -i 's/must-revalidate //' /etc/nginx/conf.d/nginx.conf && /start.sh"
    ports:
      - "8081:80"
    environment:
      - VITE_EVOLUTION_API_URL=http://api.evolutionapi.home.arpa
    depends_on:
      - evolution-api
    restart: unless-stopped
